<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101827"/><g font-family="Arial,sans-serif"><path fill="#ff943d" d="M140 95L178 118L140 141Z"/><text x="200" y="133" fill="#f6f4ee" font-size="30" font-weight="bold">FIREPRESENTER</text><text x="140" y="280" fill="#f6f4ee" font-size="88" font-weight="bold">A clip, inside the story.</text><text x="140" y="356" fill="#c4cddd" font-size="36" font-weight="normal">Press OK or Play / Pause. This original demo clip includes a quiet tone.</text><rect x="320" y="420" width="1280" height="480" rx="12" fill="#000"/><path d="M140 940H1780" stroke="#405370" stroke-width="2"/><text x="140" y="999" fill="#ff943d" font-size="25" font-weight="normal">YOUR DECK. YOUR PACE.</text><text x="645" y="999" fill="#c4cddd" font-size="24" font-weight="normal">LEFT / RIGHT: SLIDES    UP / DOWN: LINKS    OK: SELECT    MENU: CONTROLS</text></g></svg>