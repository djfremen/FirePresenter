<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101827"/><g font-family="Arial,sans-serif"><path fill="#ff943d" d="M140 95L178 118L140 141Z"/><text x="200" y="133" fill="#f6f4ee" font-size="30" font-weight="bold">FIREPRESENTER</text><text x="140" y="280" fill="#f6f4ee" font-size="88" font-weight="bold">Your presentation, ready.</text><text x="140" y="356" fill="#c4cddd" font-size="36" font-weight="normal">A small demo of graphics, slide links, and video — all on your device.</text><rect x="140" y="475" width="1640" height="330" rx="24" fill="#1e2d43"/><text x="210" y="590" fill="#f6f4ee" font-size="50" font-weight="normal">No streaming. No account. No internet at the venue.</text><text x="210" y="680" fill="#ff943d" font-size="42" font-weight="normal">Press Right or OK to begin.</text><path d="M140 940H1780" stroke="#405370" stroke-width="2"/><text x="140" y="999" fill="#ff943d" font-size="25" font-weight="normal">YOUR DECK. YOUR PACE.</text><text x="645" y="999" fill="#c4cddd" font-size="24" font-weight="normal">LEFT / RIGHT: SLIDES    UP / DOWN: LINKS    OK: SELECT    MENU: CONTROLS</text></g></svg>