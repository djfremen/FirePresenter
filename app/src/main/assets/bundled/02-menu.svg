<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101827"/><g font-family="Arial,sans-serif"><path fill="#ff943d" d="M140 95L178 118L140 141Z"/><text x="200" y="133" fill="#f6f4ee" font-size="30" font-weight="bold">FIREPRESENTER</text><text x="140" y="280" fill="#f6f4ee" font-size="88" font-weight="bold">Choose your next stop.</text><text x="140" y="356" fill="#c4cddd" font-size="36" font-weight="normal">Click a card, or use Up / Down and OK on the remote.</text><rect x="140" y="440" width="860" height="115" rx="14" fill="#1e2d43" stroke="#405370" stroke-width="3"/><text x="185" y="514" fill="#f6f4ee" font-size="42" font-weight="normal">1. Graphics that fill the screen</text><rect x="140" y="590" width="860" height="115" rx="14" fill="#1e2d43" stroke="#405370" stroke-width="3"/><text x="185" y="664" fill="#f6f4ee" font-size="42" font-weight="normal">2. A video that stays in your deck</text><rect x="140" y="740" width="860" height="115" rx="14" fill="#1e2d43" stroke="#405370" stroke-width="3"/><text x="185" y="814" fill="#f6f4ee" font-size="42" font-weight="normal">3. Finish the presentation</text><text x="1120" y="565" fill="#c4cddd" font-size="40" font-weight="normal">Slide links let the conversation</text><text x="1120" y="625" fill="#c4cddd" font-size="40" font-weight="normal">choose the route.</text><path d="M140 940H1780" stroke="#405370" stroke-width="2"/><text x="140" y="999" fill="#ff943d" font-size="25" font-weight="normal">YOUR DECK. YOUR PACE.</text><text x="645" y="999" fill="#c4cddd" font-size="24" font-weight="normal">LEFT / RIGHT: SLIDES    UP / DOWN: LINKS    OK: SELECT    MENU: CONTROLS</text></g></svg>