<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101827"/><g font-family="Arial,sans-serif"><path fill="#ff943d" d="M140 95L178 118L140 141Z"/><text x="200" y="133" fill="#f6f4ee" font-size="30" font-weight="bold">FIREPRESENTER</text><text x="140" y="280" fill="#f6f4ee" font-size="88" font-weight="bold">Take it to the room.</text><text x="140" y="356" fill="#c4cddd" font-size="36" font-weight="normal">Import a PowerPoint, or build a local deck with your own visuals.</text><text x="140" y="505" fill="#ff943d" font-size="38" font-weight="normal">When Fire TV Home is unavailable offline, launch through:</text><text x="140" y="585" fill="#f6f4ee" font-size="40" font-weight="normal">Settings → Applications → Manage Installed Applications</text><text x="140" y="655" fill="#f6f4ee" font-size="40" font-weight="normal">→ FirePresenter → Launch application</text><rect x="140" y="770" width="860" height="115" rx="14" fill="#1e2d43" stroke="#405370" stroke-width="3"/><text x="185" y="844" fill="#f6f4ee" font-size="42" font-weight="normal">Explore the demo again ↗</text><path d="M140 940H1780" stroke="#405370" stroke-width="2"/><text x="140" y="999" fill="#ff943d" font-size="25" font-weight="normal">YOUR DECK. YOUR PACE.</text><text x="645" y="999" fill="#c4cddd" font-size="24" font-weight="normal">LEFT / RIGHT: SLIDES    UP / DOWN: LINKS    OK: SELECT    MENU: CONTROLS</text></g></svg>