<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send a deck to your TV</title>
<style>body{font:20px/1.5 system-ui,sans-serif;background:#13221a;color:#f4f0e4;margin:0;padding:32px;max-width:600px}h1{font-size:36px}button,input{font:inherit;max-width:100%;margin:18px 0}button{background:#f4f0e4;color:#13221a;border:0;border-radius:8px;padding:14px 24px}button:disabled{opacity:.5}#status{white-space:pre-wrap}</style></head><body><h1>Send a deck to your TV</h1><p>Choose a PowerPoint file. It will stay on your Fire TV for offline playback.</p><input type="file" id="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation"><br><button id="send">Send to TV</button><p id="status" role="status"></p><script>
document.getElementById('send').onclick=async()=>{const f=document.getElementById('file').files[0],s=document.getElementById('status'),b=document.getElementById('send');if(!f||!f.name.toLowerCase().endsWith('.pptx')){s.textContent='Choose a .pptx file first.';return}if(f.size>64*1024*1024){s.textContent='Choose a deck smaller than 64 MB.';return}b.disabled=true;s.textContent='Sending your deck…';try{const r=await fetch('upload',{method:'POST',body:f,headers:{'Content-Type':'application/octet-stream'}});const t=await r.text();if(!r.ok)throw Error(t);s.textContent=t}catch(e){s.textContent='Upload failed: '+e.message}finally{b.disabled=false}};
</script></body></html>
